# OpenShell network policy for the Sieve agent sandbox (schema per the OpenShell "first network policy" tutorial).
# Baseline is deny-all; each rule allow-lists host:port for a named binary. Credentials are brokered by the
# provider profile, so the sandboxed process holds only placeholders.
network_policies:
  nebius_token_factory_eu:
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /workspace/.venv/bin/python
  nebius_token_factory_us:
    endpoints:
      - host: api.tokenfactory.us-central1.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /workspace/.venv/bin/python
  tavily:
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /workspace/.venv/bin/python
  openfda:
    endpoints:
      - host: api.fda.gov
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /workspace/.venv/bin/python
