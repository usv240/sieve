# OpenShell provider profile: Tavily search, extract, map and crawl.
id: tavily
display_name: Tavily
description: Tavily web search and extraction API for live manual discovery and parts lookup
category: other

credentials:
  - name: api_key
    description: Tavily API key
    env_vars: [TAVILY_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.tavily.com
    port: 443
    path: /**
    protocol: rest
    access: full
    enforcement: enforce

binaries:
  - /usr/local/bin/python3.12
  - /workspace/.venv/bin/python
