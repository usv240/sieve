# Fault concepts shared across concentrator brands. Generic text is grounded in the WHO 2015 specification
# and the EWH flowchart handbook; brand-specific steps always come from the retrieved manual pages at run time.
version: "2026-10-15.1"
faults:
  - id: impeded-flow
    name: "Impeded or restricted oxygen flow"
    symptoms: ["flow alarm", "yellow light with red blinking (EverFlo)", "patient reports weak flow", "flow meter ball drops"]
    first_checks:
      - "Check the cannula and tubing along the full length for kinks, water, or crushing"
      - "Check that the humidifier bottle, if fitted, is not overfilled and its lid is sealed"
      - "Check that the outlet is not blocked and the flow meter is set above 0.5 LPM"
    likely_causes: ["kinked or blocked tubing", "blocked humidifier", "outlet filter blocked"]
    tools: []
    skill_level: user
  - id: inlet-filter-blocked
    name: "Blocked or dirty inlet (cabinet) filter"
    symptoms: ["low purity after warm-up", "unit runs hot", "louder compressor"]
    first_checks:
      - "Remove the gross particle filter from the cabinet and inspect; wash in warm soapy water, rinse, dry fully before refitting"
      - "Check the unit has clearance from walls and curtains for ventilation"
    likely_causes: ["dust-loaded filter", "unit placed against a wall or in a cupboard"]
    tools: []
    skill_level: user
  - id: sieve-bed-exhaustion
    name: "Molecular sieve bed exhaustion"
    symptoms: ["yellow low-oxygen light persists after 15 minutes of warm-up", "purity 82 to 87 percent on analyser", "purity falls over weeks"]
    first_checks:
      - "Run the unit at its rated flow for the warm-up period in the manual, then measure purity with a calibrated oxygen analyser"
      - "Confirm inlet filter and tubing are clear before suspecting the sieve beds"
    likely_causes: ["sieve material saturated with moisture (humid climate, long service)", "sieve beds past service life"]
    tools: ["oxygen analyser"]
    skill_level: technician
    parts_hint: "sieve bed pair, brand-specific part number from the manual"
  - id: sieve-check-valve
    name: "Sieve bed check valve failure"
    symptoms: ["purity low and erratic", "pressure cycling abnormal", "hissing on cycle switch"]
    first_checks:
      - "Observe pressure gauge or listen to the cycle; compare with the manual's expected cycle behaviour"
    likely_causes: ["worn check valve allowing back-flow between beds"]
    tools: ["pressure gauge"]
    skill_level: technician
  - id: compressor-wear
    name: "Compressor wear or failure"
    symptoms: ["low pressure", "unit very loud or knocking", "runs hot and purity drops", "compressor does not start"]
    first_checks:
      - "Switch off and unplug before any inspection inside the cabinet"
      - "Check the compressor intake filter and cooling fan operation from outside first"
    likely_causes: ["worn piston cups or seals", "failed start capacitor", "seized motor"]
    tools: ["pressure gauge"]
    skill_level: engineer
    escalate: "Capacitor and compressor internals are engineer-level work; see rules capacitor-discharge"
  - id: no-power
    name: "Unit does not power on"
    symptoms: ["no lights", "no sound", "no self-test at switch on"]
    first_checks:
      - "Confirm the wall socket works with another appliance"
      - "Check the mains lead and plug for damage; check the unit's circuit breaker or fuse per the manual"
    likely_causes: ["dead socket", "tripped breaker on the unit", "damaged lead"]
    tools: []
    skill_level: user
  - id: system-malfunction
    name: "System malfunction alarm"
    symptoms: ["red light continuous with continuous alarm"]
    first_checks:
      - "Switch off, wait one minute, switch on and observe the self-test sequence described in the manual"
      - "If the alarm returns, record the exact light pattern and escalate with the manual's indicator table"
    likely_causes: ["control board fault", "sensor fault", "compressor fault"]
    tools: []
    skill_level: technician
  - id: power-cord-thermal
    name: "Overheated or burnt power cord, plug, inlet connector or wiring"
    symptoms: ["burning smell near the plug or the back of the unit", "scorched, melted or discoloured plug, cord or IEC inlet", "unit cuts out when the cord is moved", "extension lead or multi-plug adapter in use"]
    first_checks:
      - "Remove the unit from service and move the patient to a backup oxygen supply"
      - "Switch off and unplug at the wall only if the plug can be reached safely"
      - "With the unit unplugged, inspect the cord, plug and the IEC inlet on the back for scorching or melting; never reuse a damaged cord"
      - "Confirm the unit is plugged directly into a wall socket, not an extension lead or adapter"
    likely_causes: ["loose or worn plug or inlet connector making a high-resistance joint", "overloaded extension lead or adapter", "damaged line cord"]
    tools: []
    skill_level: technician
    escalate: "Internal wiring and connector repairs are engineer-level. Keep the damaged parts and report the event to the manufacturer and the national device-safety reporting system."
    parts_hint: "power cord, IEC inlet connector, wire harness"
  - id: internal-overheat
    name: "Internal overheating or heat damage (compressor, cooling fan, circuit board)"
    symptoms: ["unit switches itself off after running for a while", "cabinet hot to the touch", "smell of hot plastic", "cooling fan not running", "high-temperature alarm"]
    first_checks:
      - "Remove the unit from service if there is any smell of burning or visible heat damage"
      - "Check that cabinet and intake filters are clean and the unit has the minimum clearance from walls and curtains given in the manual"
      - "With the unit switched off and unplugged, check that the cooling fan turns freely"
      - "Do not keep resetting a thermal protector; a unit that trips again must be escalated"
    likely_causes: ["blocked filters or poor ventilation", "failed cooling fan", "compressor drawing excess current", "failed component on the control board"]
    tools: []
    skill_level: engineer
    escalate: "Heat damage inside the cabinet is engineer-level work and a reportable event."
    parts_hint: "cooling fan, compressor, control board"
  - id: external-ignition-fire
    name: "Fire at the cannula or tubing from an outside ignition source"
    symptoms: ["flame or flash at the nasal cannula or tubing", "melted cannula or tubing", "burns to the face or hands", "smoking, candle, stove or heater near the patient"]
    first_checks:
      - "Treat the patient first: stop the oxygen flow and get medical help for any burn"
      - "Remove the concentrator, tubing and cannula from service and keep them for the investigation"
      - "Record which ignition source was near the patient"
      - "Before any unit returns to use, brief the family that oxygen makes things burn fast and that nobody may smoke or use a flame nearby"
    likely_causes: ["smoking while using oxygen", "open flame or heat source near the oxygen outlet"]
    tools: []
    skill_level: user
    escalate: "Any fire involving oxygen therapy is a reportable event."
  - id: oxygen-sensor-fault
    name: "Oxygen sensor fault or false purity alarm"
    symptoms: ["low-oxygen light or alarm while a calibrated analyser reads normal purity", "purity alarm at start-up that clears and returns", "erratic purity readings"]
    first_checks:
      - "After the warm-up period, measure purity at the outlet with a calibrated oxygen analyser"
      - "If the analyser reads normal but the unit still alarms, suspect the oxygen sensor before the sieve beds"
      - "Follow the sensor test in the manual before replacing sieve beds"
    likely_causes: ["oxygen sensor drift or failure", "loose sensor connection"]
    tools: ["oxygen analyser"]
    skill_level: technician
    parts_hint: "oxygen sensor"
  - id: control-board-fault
    name: "Control (PC) board fault"
    symptoms: ["red system-fault light with no other cause found", "unit powers on but the valves do not cycle", "erratic lights or alarms", "no response to the power switch while mains is present"]
    first_checks:
      - "Confirm the mains supply and the unit's own breaker first"
      - "Record the exact light and alarm pattern and match it to the indicator table in the manual"
      - "With the unit unplugged, look for heat discoloration at board connectors"
    likely_causes: ["failed component on the control board", "loose board connector", "power surge damage"]
    tools: []
    skill_level: engineer
    parts_hint: "control PC board"
